name: Build Lotus APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Create Gradle Wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias lotus \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lotusmembers -keypass lotusmembers \
            -dname "CN=Lotus Members, OU=Lotus, O=TASP, L=City, ST=ST, C=IN"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: lotusmembers
          KEY_ALIAS: lotus
          KEY_PASSWORD: lotusmembers
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Lotus-Members-Release-APK
          path: app/build/outputs/apk/release/*.apk
